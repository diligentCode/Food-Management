<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>FoodConnect</title>
    <script type="text/javascript">
      // GitHub Pages SPA 404 fallback: Redirects clean paths to HashRouter
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var pathname = l.pathname;
      var repoBase = pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var subPath = pathname.split('/').slice(1 + pathSegmentsToKeep).join('/');
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoBase + '/#/' + subPath + (l.search || '') + (l.hash || '');
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    <p>Redirecting to FoodConnect...</p>
  </body>
</html>
